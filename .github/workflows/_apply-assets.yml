name: Apply updated artwork

on:
  push:
    branches:
      - docs/end-user-readme
    paths:
      - .asset-upload/source.webp.b64
      - .github/workflows/_apply-assets.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Generate Kodi artwork
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow
          base64 --decode .asset-upload/source.webp.b64 > /tmp/managarr-source.webp
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source_path = Path('/tmp/managarr-source.webp')
          with Image.open(source_path) as opened:
              source = opened.convert('RGB')

          if source.size != (512, 512):
              source = source.resize((512, 512), Image.Resampling.LANCZOS)

          icon = source.quantize(
              colors=128,
              method=Image.Quantize.MEDIANCUT,
              dither=Image.Dither.FLOYDSTEINBERG,
          )
          icon.save('resources/icon.png', format='PNG', optimize=True, compress_level=9)

          fan_source = source.resize((1080, 1080), Image.Resampling.LANCZOS)
          fanart = Image.new('RGB', (1920, 1080), (0, 0, 0))
          fanart.paste(fan_source, (420, 0))
          fanart.save(
              'resources/fanart.jpg',
              format='JPEG',
              quality=84,
              optimize=True,
              progressive=True,
              subsampling='4:2:0',
          )

          for path in (Path('resources/icon.png'), Path('resources/fanart.jpg')):
              with Image.open(path) as image:
                  print(path, image.size, image.mode, image.format, path.stat().st_size)
          PY
          python scripts/validate.py
      - name: Commit final artwork and remove transfer files
        run: |
          set -euo pipefail
          rm -rf .asset-upload .github/workflows/_apply-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'assets: replace icon and fanart'
          git push origin HEAD:docs/end-user-readme
