name: Apply PR25 documentation and outcome hardening

on:
  push:
    branches:
      - fix/episode-replacement-reliability

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'stage(pr25-docs):')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply final hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 .automation/pr25/finalise.py
          rm -f .automation/pr25/finalise.py .github/workflows/apply-pr25-docs.yml
          rmdir .automation/pr25 2>/dev/null || true
          rmdir .automation 2>/dev/null || true
          python3 -m compileall -q resources/lib tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(replacement): finalise outcomes and validation contract'
          git push origin HEAD:fix/episode-replacement-reliability
