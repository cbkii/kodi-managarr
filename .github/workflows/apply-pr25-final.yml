name: Apply PR25 final reliability payload

on:
  push:
    branches:
      - fix/episode-replacement-reliability

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'stage(pr25):')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply audited payload
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/pr25/payload-* | base64 --decode > /tmp/pr25-final.tar.gz
          tar -xzf /tmp/pr25-final.tar.gz -C .
          rm -rf .automation/pr25 .github/workflows/apply-pr25-final.yml
          python3 -m compileall -q resources/lib tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(replacement): finalise queued search recovery and evidence'
          git push origin HEAD:fix/episode-replacement-reliability
