name: Generate and publish Kodi repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag to publish; blank selects the latest stable release
        required: false
        default: ""
        type: string
  # One-time branch trigger used to establish and verify the Pages install surface.
  # Remove this trigger after the first successful deployment.
  push:
    branches: [docs/end-user-readme]
    paths:
      - .github/workflows/pages.yml
      - pages/**
      - scripts/generate_repo.py
      - tests/test_generate_repo.py

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: kodi-repository-pages
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.release.draft == false && github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      addon_version: ${{ steps.generate.outputs.addon_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      repository_zip: ${{ steps.generate.outputs.repository_zip }}
      repository_url: ${{ steps.generate.outputs.repository_url }}
    steps:
      - name: Check out repository tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve exact stable release
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="$EVENT_TAG"
          if [ "$GITHUB_EVENT_NAME" != release ]; then
            tag="$REQUESTED_TAG"
            if [ -z "$tag" ]; then
              tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')"
            fi
          fi
          test -n "$tag"
          metadata="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName)"
          test "$(jq -r '.isDraft' <<<"$metadata")" = false
          test "$(jq -r '.isPrerelease' <<<"$metadata")" = false
          resolved="$(jq -r '.tagName' <<<"$metadata")"
          echo "release_tag=$resolved" >> "$GITHUB_OUTPUT"

      - name: Download exact published add-on asset
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir release-asset
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'managarr-addon_v*.zip' \
            --dir release-asset
          mapfile -t assets < <(find release-asset -maxdepth 1 -type f -name 'managarr-addon_v*.zip' -print)
          test "${#assets[@]}" -eq 1
          mv "${assets[0]}" release.zip

      - name: Test repository generator
        run: python -m unittest tests.test_generate_repo -v

      - name: Generate and validate repository
        id: generate
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=1700000000
          repository_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          python scripts/generate_repo.py release.zip --repo-url "$repository_url"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          import zipfile
          from html.parser import HTMLParser
          from pathlib import Path

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []

              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      href = dict(attrs).get('href')
                      if href:
                          self.hrefs.append(href)

          output_root = Path('pages_output')
          root = ET.parse(output_root / 'addons.xml').getroot()
          versions = {addon.attrib['id']: addon.attrib['version'] for addon in root.findall('addon')}
          version = versions['context.arr.manager']
          repo_version = versions['repository.managarr']
          repository_zip = output_root / 'repository.managarr' / f'repository.managarr-{repo_version}.zip'
          addon_zip = output_root / 'context.arr.manager' / f'context.arr.manager-{version}.zip'
          for path, root_name in ((repository_zip, 'repository.managarr/'), (addon_zip, 'context.arr.manager/')):
              assert path.is_file() and path.stat().st_size > 0
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None
                  assert archive.namelist() and all(name.startswith(root_name) for name in archive.namelist())

          index = (output_root / 'index.html').read_text(encoding='utf-8')
          assert f'repository.managarr-{repo_version}.zip' in index
          assert f'context.arr.manager-{version}.zip' in index
          assert '{{' not in index
          parser = Links()
          parser.feed(index)
          for href in parser.hrefs:
              if href.startswith(('https://', 'http://', 'mailto:')):
                  continue
              assert (output_root / href).is_file(), href
          assert (output_root / 'styles.css').is_file()
          assert (output_root / '.nojekyll').is_file()

          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as handle:
              handle.write(f'addon_version={version}\n')
              handle.write(f'repository_zip={repository_zip.name}\n')
              handle.write(f'repository_url=https://{os.environ["GITHUB_REPOSITORY_OWNER"]}.github.io/{os.environ["GITHUB_REPOSITORY"].split("/", 1)[1]}\n')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages_output

      - name: Build summary
        env:
          ADDON_VERSION: ${{ steps.generate.outputs.addon_version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          REPOSITORY_ZIP: ${{ steps.generate.outputs.repository_zip }}
          REPOSITORY_URL: ${{ steps.generate.outputs.repository_url }}
        run: |
          {
            echo '## Kodi repository build'
            echo "- Stable release: \`$RELEASE_TAG\`"
            echo "- Kodi Managarr: \`$ADDON_VERSION\`"
            echo "- Repository: $REPOSITORY_URL"
            echo "- Install ZIP: $REPOSITORY_URL/repository.managarr/$REPOSITORY_ZIP"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify live installation endpoints
        id: verify
        env:
          ADDON_VERSION: ${{ needs.build.outputs.addon_version }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REPOSITORY_ZIP: ${{ needs.build.outputs.repository_zip }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          expected="repository.managarr/$REPOSITORY_ZIP"
          html="$RUNNER_TEMP/index.html"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 20 "$base/" --output "$html" \
              && grep --fixed-strings --quiet "$expected" "$html"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Pages landing page did not publish the expected repository ZIP" >&2
              exit 1
            fi
            sleep 10
          done
          for path in \
            addons.xml \
            addons.xml.md5 \
            "$expected" \
            "$expected.sha256" \
            "context.arr.manager/context.arr.manager-$ADDON_VERSION.zip"; do
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 3 --max-time 20 \
              "$base/$path" --output /dev/null
          done

      - name: Deployment summary
        if: success()
        env:
          ADDON_VERSION: ${{ needs.build.outputs.addon_version }}
          REPOSITORY_URL: ${{ needs.build.outputs.repository_url }}
          REPOSITORY_ZIP: ${{ needs.build.outputs.repository_zip }}
        run: |
          {
            echo '## Kodi repository published and verified'
            echo "- Kodi Managarr: \`$ADDON_VERSION\`"
            echo "- Repository URL: $REPOSITORY_URL"
            echo "- Install ZIP: $REPOSITORY_URL/repository.managarr/$REPOSITORY_ZIP"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record bootstrap deployment result
        if: always() && github.event_name == 'push'
        env:
          ADDON_VERSION: ${{ needs.build.outputs.addon_version }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REPOSITORY_ZIP: ${{ needs.build.outputs.repository_zip }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          body="$RUNNER_TEMP/pages-result.md"
          {
            echo '<!-- managarr-pages-bootstrap -->'
            echo '## Kodi repository Pages bootstrap'
            echo
            echo "- Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Deployment: \`$DEPLOY_OUTCOME\`"
            echo "- Live endpoint verification: \`$VERIFY_OUTCOME\`"
            if [ "$VERIFY_OUTCOME" = success ]; then
              echo "- Landing page: $base/"
              echo "- Repository ZIP: $base/repository.managarr/$REPOSITORY_ZIP"
              echo "- Published add-on: \`$ADDON_VERSION\`"
            fi
          } > "$body"
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/29/comments" --jq '.[] | select(.body | contains("<!-- managarr-pages-bootstrap -->")) | .id' | head -n 1)"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" --raw-field body="$(cat "$body")" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/29/comments" --raw-field body="$(cat "$body")" >/dev/null
          fi
