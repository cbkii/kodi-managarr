name: Generate and publish Kodi repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag to publish; blank selects the latest stable release
        required: false
        default: ""
        type: string
  # One-time branch trigger used to establish and verify the generated source.
  # Remove this trigger after the first successful publication.
  push:
    branches: [docs/end-user-readme]
    paths:
      - .github/workflows/pages.yml
      - pages/**
      - scripts/generate_repo.py
      - tests/test_generate_repo.py

permissions:
  contents: write

concurrency:
  group: kodi-repository-publish
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.release.draft == false && github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve exact stable release
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="$EVENT_TAG"
          if [ "$GITHUB_EVENT_NAME" != release ]; then
            tag="$REQUESTED_TAG"
            if [ -z "$tag" ]; then
              tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')"
            fi
          fi
          test -n "$tag"
          metadata="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName)"
          test "$(jq -r '.isDraft' <<<"$metadata")" = false
          test "$(jq -r '.isPrerelease' <<<"$metadata")" = false
          resolved="$(jq -r '.tagName' <<<"$metadata")"
          echo "release_tag=$resolved" >> "$GITHUB_OUTPUT"

      - name: Download exact published add-on asset
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir release-asset
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'managarr-addon_v*.zip' \
            --dir release-asset
          mapfile -t assets < <(find release-asset -maxdepth 1 -type f -name 'managarr-addon_v*.zip' -print)
          test "${#assets[@]}" -eq 1
          mv "${assets[0]}" release.zip

      - name: Test repository generator
        run: python -m unittest tests.test_generate_repo -v

      - name: Generate and validate repository
        id: generate
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=1700000000
          raw_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/gh-pages"
          website_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          python scripts/generate_repo.py release.zip \
            --repo-url "$raw_url" \
            --website-url "$website_url"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          import zipfile
          from html.parser import HTMLParser
          from pathlib import Path

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []

              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      href = dict(attrs).get('href')
                      if href:
                          self.hrefs.append(href)

          output_root = Path('pages_output')
          root = ET.parse(output_root / 'addons.xml').getroot()
          versions = {addon.attrib['id']: addon.attrib['version'] for addon in root.findall('addon')}
          addon_version = versions['context.arr.manager']
          repo_version = versions['repository.managarr']
          repository_zip = output_root / 'repository.managarr' / 'repository.managarr.zip'
          addon_zip = output_root / 'context.arr.manager' / 'context.arr.manager.zip'
          for path, root_name in ((repository_zip, 'repository.managarr/'), (addon_zip, 'context.arr.manager/')):
              assert path.is_file() and path.stat().st_size > 0
              assert path.with_name(path.name + '.sha256').is_file()
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None
                  assert archive.namelist() and all(name.startswith(root_name) for name in archive.namelist())

          repository = root.find("./addon[@id='repository.managarr']/extension[@point='xbmc.addon.repository']/dir")
          expected_base = f'https://raw.githubusercontent.com/{os.environ["GITHUB_REPOSITORY"]}/gh-pages'
          assert repository.findtext('info') == f'{expected_base}/addons.xml'
          assert repository.findtext('checksum') == f'{expected_base}/addons.xml.md5'
          assert repository.findtext('datadir') == f'{expected_base}/'

          index = (output_root / 'index.html').read_text(encoding='utf-8')
          assert 'repository.managarr/repository.managarr.zip' in index
          assert 'context.arr.manager/context.arr.manager.zip' in index
          assert '{{' not in index
          parser = Links()
          parser.feed(index)
          for href in parser.hrefs:
              if href.startswith(('https://', 'http://', 'mailto:')):
                  continue
              assert (output_root / href).is_file(), href
          assert (output_root / 'styles.css').is_file()
          assert (output_root / '.nojekyll').is_file()

          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f'addon_version={addon_version}\n')
              handle.write(f'repository_version={repo_version}\n')
          PY

      - name: Publish generated repository source
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/gh-pages"
          git worktree add --detach "$publish_dir" HEAD
          (
            cd "$publish_dir"
            git switch --orphan generated-repository
            git rm -rf . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a "$GITHUB_WORKSPACE/pages_output/." .
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m "chore(repository): publish $RELEASE_TAG"
            git push --force origin HEAD:gh-pages
          )
          git worktree remove --force "$publish_dir"

      - name: Verify published raw repository
        id: verify
        env:
          ADDON_VERSION: ${{ steps.generate.outputs.addon_version }}
          REPOSITORY_VERSION: ${{ steps.generate.outputs.repository_version }}
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/gh-pages"
          verify_dir="$RUNNER_TEMP/verify"
          mkdir "$verify_dir"
          expected='repository.managarr/repository.managarr.zip'
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 20 "$base/index.html" --output "$verify_dir/index.html" \
              && grep --fixed-strings --quiet "$expected" "$verify_dir/index.html"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo 'Generated repository source did not become readable' >&2
              exit 1
            fi
            sleep 5
          done
          for path in \
            addons.xml \
            addons.xml.md5 \
            repository.managarr/repository.managarr.zip \
            repository.managarr/repository.managarr.zip.sha256 \
            context.arr.manager/context.arr.manager.zip \
            context.arr.manager/context.arr.manager.zip.sha256; do
            destination="$verify_dir/${path##*/}"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 3 --max-time 20 \
              "$base/$path" --output "$destination"
          done
          (
            cd "$verify_dir"
            sha256sum --check repository.managarr.zip.sha256
            sha256sum --check context.arr.manager.zip.sha256
          )
          export VERIFY_DIR="$verify_dir"
          export RAW_BASE="$base"
          python - <<'PY'
          import hashlib
          import os
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path

          root = Path(os.environ['VERIFY_DIR'])
          addons = (root / 'addons.xml').read_bytes()
          assert hashlib.md5(addons).hexdigest() == (root / 'addons.xml.md5').read_text().strip()  # nosec B303: Kodi change token
          manifest = ET.fromstring(addons)
          versions = {addon.attrib['id']: addon.attrib['version'] for addon in manifest.findall('addon')}
          assert versions['context.arr.manager'] == os.environ['ADDON_VERSION']
          assert versions['repository.managarr'] == os.environ['REPOSITORY_VERSION']
          with zipfile.ZipFile(root / 'repository.managarr.zip') as archive:
              assert archive.testzip() is None
              repository_xml = ET.fromstring(archive.read('repository.managarr/addon.xml'))
              directory = repository_xml.find("./extension[@point='xbmc.addon.repository']/dir")
              base = os.environ['RAW_BASE']
              assert directory.findtext('info') == f'{base}/addons.xml'
              assert directory.findtext('checksum') == f'{base}/addons.xml.md5'
              assert directory.findtext('datadir') == f'{base}/'
          with zipfile.ZipFile(root / 'context.arr.manager.zip') as archive:
              assert archive.testzip() is None
              assert 'context.arr.manager/addon.xml' in archive.namelist()
          PY
          echo "repository_sha256=$(sha256sum "$verify_dir/repository.managarr.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "raw_base=$base" >> "$GITHUB_OUTPUT"

      - name: Publication summary
        env:
          ADDON_VERSION: ${{ steps.generate.outputs.addon_version }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          RAW_BASE: ${{ steps.verify.outputs.raw_base }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          REPOSITORY_SHA256: ${{ steps.verify.outputs.repository_sha256 }}
        run: |
          {
            echo '## Kodi repository published and verified'
            echo "- Stable release: \`$RELEASE_TAG\`"
            echo "- Kodi Managarr: \`$ADDON_VERSION\`"
            echo "- Generated source branch: \`gh-pages\`"
            echo "- Repository ZIP: $RAW_BASE/repository.managarr/repository.managarr.zip"
            echo "- Repository SHA-256: \`$REPOSITORY_SHA256\`"
            echo "- Pages-ready URL: $PAGES_URL"
          } >> "$GITHUB_STEP_SUMMARY"
